<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Goal Referee</title>
  <style>
    :root { color-scheme: dark; --ink:#f7f7fb; --muted:#a9abc0; --panel:#171821; --line:#2c2e3d; --accent:#8b7cff; --good:#56d99c; --warn:#ffbe62; }
    * { box-sizing:border-box } body { margin:0; font-family:Inter,system-ui,sans-serif; background:#0d0e13; color:var(--ink) }
    main { width:min(1120px,92vw); margin:0 auto; padding:64px 0 80px }
    header { display:grid; gap:18px; margin-bottom:38px } .eyebrow { color:var(--accent); letter-spacing:.14em; font-size:12px; font-weight:800 }
    h1 { font-size:clamp(40px,7vw,76px); line-height:.94; margin:0; max-width:820px; letter-spacing:-.055em }
    .lead { color:var(--muted); font-size:18px; max-width:680px; line-height:1.65 }
    .actions { display:flex; flex-wrap:wrap; gap:10px } button { border:0; border-radius:12px; padding:13px 18px; font-weight:750; cursor:pointer; background:var(--accent); color:white }
    button.secondary { background:#252735 } button:disabled { opacity:.45; cursor:not-allowed }
    .status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px }.dot { width:9px; height:9px; border-radius:50%; background:var(--warn) }
    section { margin-top:42px } h2 { font-size:19px; margin:0 0 16px } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px }
    .card { background:linear-gradient(145deg,#191a24,#13141b); border:1px solid var(--line); border-radius:18px; padding:20px; min-height:210px }
    .card h3 { margin:7px 0 12px; font-size:18px }.tag { display:inline-block; color:var(--accent); font-size:12px; font-weight:800; text-transform:uppercase }
    .owner { font-size:30px; font-weight:850; margin:12px 0 }.muted { color:var(--muted); line-height:1.55 }.meta { margin-top:16px; display:flex; justify-content:space-between; color:var(--muted); font-size:13px }
    .bar { height:7px; background:#292b38; border-radius:99px; overflow:hidden; margin-top:16px }.bar i { display:block; height:100%; background:var(--good) }
    .empty { border:1px dashed var(--line); padding:32px; border-radius:18px; color:var(--muted) }
    footer { margin-top:56px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:13px }
  </style>
</head>
<body><main>
  <header><div class="eyebrow">EVIDENCE, NOT ACTIVITY</div><h1>Discord Goal Referee</h1><div class="lead">대화 속 약속과 파일을 근거로 역할을 제안합니다. 배정과 완료는 사람이 확인할 때만 확정됩니다.</div>
    <div class="actions"><button id="seed">1. 데모 데이터 넣기</button><button id="assign" class="secondary" disabled>2. 역할 제안 만들기</button></div>
    <div class="status"><span class="dot"></span><span id="status">준비됨 — fixture fallback 모드</span></div>
  </header>
  <section><h2>역할 제안</h2><div id="assignments" class="empty">아직 역할 제안이 없습니다.</div></section>
  <section><h2>증거 기반 진행률</h2><div id="progress" class="empty">역할을 제안하면 진행률이 표시됩니다.</div></section>
  <section><h2>모든 파일</h2><div id="files" class="empty">데모 데이터를 먼저 넣어주세요.</div></section>
  <footer>허용 채널만 분석 · 메시지량 점수화 금지 · 위험 행동은 사람 확인</footer>
</main><script>
const $=s=>document.querySelector(s); const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
$('#seed').onclick=async()=>{const d=await post('/api/demo/seed'); $('#assign').disabled=false; $('#status').textContent='fixture 입력 완료'; renderFiles(d.artifacts)};
$('#assign').onclick=async()=>{const d=await post('/api/assign'); renderAssignments(d.assignments); await refreshProgress(); $('#status').textContent='역할 제안 완료 — 사람 확인 대기'};
function renderAssignments(items){const el=$('#assignments');el.className='grid';el.innerHTML=items.map(a=>`<article class="card"><span class="tag">${a.status}</span><h3>${a.task}</h3><div class="owner">${a.owner??'미정'}</div><div class="muted">${a.reason}</div><div class="meta"><span>신뢰도 ${Math.round(a.confidence*100)}%</span><span>${a.blockers[0]??'blocker 없음'}</span></div>${a.owner?`<button style="margin-top:16px" onclick="confirmOne('${a.id}')">이 배정 확인</button>`:''}</article>`).join('')}
async function confirmOne(id){await post('/api/confirm',{assignment_id:id,actor:'demo-admin'}); const d=await post('/api/assign'); renderAssignments(d.assignments); await refreshProgress(); $('#status').textContent='사람이 배정을 확인함'}
async function refreshProgress(){const d=await fetch('/api/progress/demo-project').then(r=>r.json());const el=$('#progress');el.className='grid';el.innerHTML=d.progress.map(p=>`<article class="card"><span class="tag">${p.state}</span><h3>${p.task}</h3><div class="owner">${p.percent??'N/A'}${p.percent===null?'':'%'}</div><div class="bar"><i style="width:${p.percent??0}%"></i></div><div class="muted" style="margin-top:14px">${p.next_action}</div></article>`).join('')}
function renderFiles(items){const el=$('#files');el.className='grid';el.innerHTML=items.map(f=>`<article class="card"><span class="tag">${f.validation_status}</span><h3>${f.file_name}</h3><div class="owner">${f.version}</div><div class="muted">Task ${f.task_id}<br>checksum ${f.checksum}</div></article>`).join('')}
</script></body></html>
