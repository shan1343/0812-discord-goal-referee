<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Discord Goal Referee</title>
  <style>
    :root{color-scheme:dark;--bg:#090a0f;--panel:#151620;--line:#2b2d3a;--ink:#f5f3fb;--muted:#aaa8b5;--purple:#8b72ff;--green:#69e29e;--yellow:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 0,#1d1538,transparent 34%),var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{width:min(1120px,calc(100% - 32px));margin:auto;padding:42px 0 72px}nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:72px}.brand{font-weight:850;font-size:19px}.brand span{display:inline-grid;place-items:center;width:38px;height:38px;margin-right:9px;border-radius:11px;background:var(--purple)}.live{color:var(--muted);font-size:13px}.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yellow);margin-right:7px}.live.ready i{background:var(--green)}header{max-width:790px;margin-bottom:42px}.eyebrow{margin:0 0 12px;color:var(--purple);font-size:12px;font-weight:850;letter-spacing:.14em}h1{font-size:clamp(46px,8vw,82px);line-height:.95;letter-spacing:-.06em;margin:0}h1 em{font-style:normal;color:var(--purple)}header>p:last-child{max-width:650px;color:var(--muted);line-height:1.7;font-size:17px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metrics article,.panel{background:rgba(21,22,32,.94);border:1px solid var(--line);border-radius:16px}.metrics article{padding:20px}.metrics b{display:block;color:var(--green);font-size:30px}.metrics span,.muted{color:var(--muted);font-size:13px}.panel{padding:24px;margin-top:18px}.panel h2{margin:0;font-size:22px}.taskGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}.task{background:#1b1c27;border:1px solid var(--line);border-radius:13px;padding:18px}.task h3{font-size:17px;margin:12px 0 8px}.task strong{color:var(--green)}.task p{color:var(--muted);line-height:1.55;font-size:14px}.task small{display:block;border-top:1px solid var(--line);padding-top:12px;color:#c1bdcf}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#322b55;color:#c8bbff;font-size:11px;font-weight:800}.badge.needs_input{background:#49381d;color:var(--yellow)}.empty{padding:46px;text-align:center}.empty p{color:var(--muted)}footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}@media(max-width:700px){nav{margin-bottom:48px}.metrics,.taskGrid{grid-template-columns:1fr}h1{font-size:52px}}
  </style>
</head>
<body><main>
  <nav><div class="brand"><span>GR</span> GoalReferee</div><div id="live" class="live"><i></i><span>동기화 확인 중</span></div></nav>
  <header><p class="eyebrow">EVIDENCE, NOT ACTIVITY</p><h1>Discord 대화를<br><em>실행 근거</em>로.</h1><p>메시지 수가 아니라 직접 약속한 역할과 출처 메시지를 연결합니다. AI 제안은 사람이 확인하기 전까지 확정하지 않습니다.</p></header>
  <div id="content"><section class="panel empty"><h2>최신 Discord 분석을 불러오는 중입니다.</h2><p>Discord에서 <code>/goal-referee</code>를 실행한 뒤 웹 버튼을 선택하세요.</p></section></div>
  <footer>허용 채널만 분석 · 근거 없는 담당자 자동 확정 금지 · 토큰과 API 키는 화면에 표시하지 않음</footer>
</main><script>
const API_BASE=__API_BASE_URL__||location.origin;
const esc=(value)=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const query=new URLSearchParams(location.search);const channel=query.get("channel");
const content=document.querySelector("#content");const live=document.querySelector("#live");
function message(title,body){content.innerHTML=`<section class="panel empty"><h2>${esc(title)}</h2><p>${esc(body)}</p></section>`}
function render(result){const proposed=result.tasks.filter(t=>t.status==="proposed").length;const cards=result.tasks.map(t=>`<article class="task"><span class="badge ${esc(t.status)}">${t.status==="proposed"?"역할 제안":"확인 필요"}</span><h3>${esc(t.title)}</h3><strong>${esc(t.ownerName||"담당자 미정")}</strong><p>${esc(t.reason)}</p><small>근거 메시지: ${esc(t.evidenceMessageIds.join(", ")||"없음")}</small></article>`).join("");content.innerHTML=`<section class="metrics"><article><b>${result.sourceMessageCount??0}</b><span>분석 메시지</span></article><article><b>${result.tasks.length}</b><span>추출 작업</span></article><article><b>${proposed}</b><span>근거 있는 제안</span></article><article><b>${result.tasks.length-proposed}</b><span>추가 확인 필요</span></article></section><section class="panel"><p class="eyebrow">01 / LATEST DISCORD RESULT</p><h2>${esc(result.summary)}</h2><p class="muted">최근 분석 ${esc(new Date(result.generatedAt).toLocaleString("ko-KR"))}</p><div class="taskGrid">${cards}</div></section><section class="panel"><p class="eyebrow">02 / HUMAN CHECK</p><h2>사람이 확인할 항목</h2><p class="muted">${result.questions.length?result.questions.map(esc).join(" · "):"현재 추가 질문이 없습니다."}</p></section>`;live.classList.add("ready");live.querySelector("span").textContent="Discord 동기화됨"}
const suffix=channel?`?channel_id=${encodeURIComponent(channel)}`:"";fetch(`${API_BASE}/api/goal-referee/results/latest${suffix}`).then(async r=>{if(r.status===404)return null;if(!r.ok)throw new Error();return r.json()}).then(data=>data?render(data):message("아직 게시된 Discord 분석이 없습니다.","Discord에서 /goal-referee를 실행하면 이 화면에 자동 반영됩니다.")).catch(()=>message("동기화 API에 연결할 수 없습니다.","잠시 후 다시 시도해 주세요."));
</script></body>
</html>
